<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow w-100" style="max-width: 400px;">
        <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Login</h2>
            <form #form="ngForm" (ngSubmit)="onSubmit(form)">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required
                        #emailRef="ngModel" class="form-control" />
                    @if (emailRef.invalid && emailRef.touched) {
                    <div class="text-danger small">
                        Email obrigatório.
                    </div>
                    }
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" id="senha" name="senha" [(ngModel)]="loginData.senha" required
                        #senhaRef="ngModel" class="form-control" />
                    @if (senhaRef.invalid && senhaRef.touched) {
                    <div class="text-danger small">
                        Senha obrigatória.
                    </div>
                    }
                </div>
                <button type="submit" [disabled]="form.invalid" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>
