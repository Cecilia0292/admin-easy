<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Cadastro de presentes</h5>

            <form>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="name" class="form-label">Nome Pt-br</label>
                        <input type="text" id="name" class="form-control" #nameInput />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="name" class="form-label">Nome En</label>
                        <input type="text" id="name" class="form-control" #nameInput />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="name" class="form-label">Nome Es</label>
                        <input type="text" id="name" class="form-control" #nameInput />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="description" class="form-label">Descrição PT-BR</label>
                        <textarea id="description" class="form-control" formControlName="description"
                            rows="3"></textarea>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="description" class="form-label">Descrição EN</label>
                        <textarea id="description" class="form-control" formControlName="description"
                            rows="3"></textarea>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="description" class="form-label">Descrição ES</label>
                        <textarea id="description" class="form-control" formControlName="description"
                            rows="3"></textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">Categoria</label>
                        <select id="category" class="form-select" #categoryInput>
                            @for (cat of categoryList; track cat.id) {
                            <option [value]="cat.id">{{ cat.translations[0].name }}</option>
                            }
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="name" class="form-label">Valor</label>
                        <input type="text" id="name" class="form-control" #nameInput />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="image" class="form-label">Imagem</label>
                        <input type="file" id="image" class="form-control" #imageInput />
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-success" (click)="addGift()">
                        <i class="bi bi-plus-circle me-1"></i> Incluir
                    </button>
                    <button type="button" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i> Remover
                    </button>
                    <button type="button" class="btn btn-primary">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> Limpar
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
