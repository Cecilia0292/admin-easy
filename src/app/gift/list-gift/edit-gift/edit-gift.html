<div class="row mb-2 mt-2">
    <div class="col-12">
        <form>
            <div class="row">
                <div class="col-dm-6 form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" class="form-control" #nameInput>
                </div>
                <div class="col-dm-6 form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" class="form-control" formControlName="description" rows="6"></textarea>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-4 form-group">
                    <label for="value">Valor</label>
                    <input type="number" id="value" class="form-control" #valueInput>
                </div>
                <div class="col-sm-8 form-group">
                    <label for="category">Categoria</label>
                    <select id="category" class="form-control" #categoryInput>
                        @for (cat of categoryList; track cat.id) {
                        <option [value]="cat.id">{{ cat.name }}</option>
                        }
                    </select>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-sm-4 form-group">
                    <label for="image">Imagem</label>
                    <input type="file" id="image" class="form-control-file" #imageInput>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-12">
                    <button type="button" class="btn btn-success mx-md-1" (click)="addGift()">Incluir</button>
                    <button type="button" class="btn btn-danger mx-md-1">Remover</button>
                    <button type="button" class="btn btn-primary mx-md-1">Limpar</button>
                </div>
            </div>
        </form>

    </div>

</div>
