<div class="row">
    <div class="col-sm-12">
        <app-edit-gift></app-edit-gift>
        <hr>
        <ul class="list-group">
            @for (gift of giftList; track $index){
                <a href="#" class="list-group-item clearfix" class="list-group-item" style="cursor:pointer">
                    {{gift.name}} {{gift.description}} {{gift.category.name}} - R$ {{gift.value}} {{gift.image}}
                </a>
            }
        </ul>
    </div>
</div>
