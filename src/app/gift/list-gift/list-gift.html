<div class="row">
    <div class="col-sm-12">
        <app-edit-gift></app-edit-gift>
        <hr>
        <ul class="list-group">
            <a *ngFor="let gift of giftList; let i = index" href="#" class="list-group-item clearfix"
                style="cursor:pointer">
                {{gift.name}} {{gift.description}} {{gift.category.translations.en.name}} - R$ {{gift.value}}
                {{gift.image}}
            </a>
        </ul>
    </div>
</div>
